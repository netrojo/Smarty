<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="12" fill="#0d1117"/>
  <text x="550" y="34" text-anchor="middle" fill="#7d8590" font-size="14" font-weight="600" letter-spacing="3">SMARTY PRODUCTION CIRCUIT</text>
  <text x="550" y="52" text-anchor="middle" fill="#484f58" font-size="10">2-Channel Relay Driver · Isolated Control · Flyback Protected</text>

  <!-- ====== POWER INPUT ====== -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="150" height="90" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" fill="#f85149" font-size="12" font-weight="700">POWER INPUT</text>
    <text x="75" y="40" text-anchor="middle" fill="#7d8590" font-size="9">Hi-Link HLK-PM01</text>
    <text x="75" y="54" text-anchor="middle" fill="#7d8590" font-size="9">AC 85–265V → 5V DC</text>

    <!-- AC input -->
    <text x="30" y="78" fill="#f0c040" font-size="9">L (Live)</text>
    <text x="105" y="78" fill="#f0c040" font-size="9">N (Neutral)</text>
    <circle cx="30" cy="85" r="5" fill="#f85149"/>
    <circle cx="105" cy="85" r="5" fill="#e6edf3"/>

    <!-- DC output -->
    <line x1="75" y1="90" x2="75" y2="100" stroke="#f85149" stroke-width="2"/>
    <text x="55" y="112" fill="#f85149" font-size="9">+5V DC</text>
    <text x="95" y="112" fill="#7d8590" font-size="9">GND</text>
  </g>

  <!-- ====== ESP32 ====== -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="150" height="230" rx="8" fill="#161b22" stroke="#00adb5" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" fill="#00adb5" font-size="12" font-weight="700">ESP32</text>
    <text x="75" y="38" text-anchor="middle" fill="#7d8590" font-size="9">DevKit V1</text>

    <!-- GPIO pins -->
    <text x="12" y="70" fill="#58a6ff" font-size="9">GPIO 23</text>
    <text x="12" y="110" fill="#3fb950" font-size="9">GPIO 22</text>
    <text x="12" y="150" fill="#7d8590" font-size="9">GND</text>
    <text x="12" y="188" fill="#f85149" font-size="9">5V (VIN)</text>

    <circle cx="30" cy="67" r="5" fill="#58a6ff" filter="url(#glow)"/>
    <circle cx="30" cy="107" r="5" fill="#3fb950" filter="url(#glow)"/>
    <circle cx="30" cy="147" r="5" fill="#7d8590"/>
    <circle cx="30" cy="185" r="5" fill="#f85149"/>

    <text x="140" y="22" fill="#484f58" font-size="8" text-anchor="end">U1</text>
  </g>

  <!-- ====== 5V BUS (shared) ====== -->
  <line x1="125" y1="185" x2="800" y2="185" stroke="#f85149" stroke-width="2"/>
  <text x="420" y="178" fill="#f85149" font-size="9">5V POWER BUS</text>

  <!-- GND rail -->
  <line x1="125" y1="147" x2="800" y2="147" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="420" y="140" fill="#7d8590" font-size="9">GND RAIL</text>

  <!-- ====== RELAY DRIVER CHANNEL 1 ====== -->
  <g transform="translate(330, 250)">
    <rect x="0" y="0" width="330" height="340" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="165" y="20" text-anchor="middle" fill="#484f58" font-size="10" font-weight="600" letter-spacing="1">CHANNEL 1</text>

    <!-- Transistor symbol Q1 (2N2222 NPN) -->
    <text x="30" y="70" fill="#58a6ff" font-size="10" font-weight="700">Q1</text>
    <text x="30" y="82" fill="#7d8590" font-size="8">2N2222A</text>
    <g transform="translate(95, 70)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <line x1="-14" y1="0" x2="-28" y2="0" stroke="#58a6ff" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="-22" stroke="#58a6ff" stroke-width="2"/>
      <line x1="-4" y1="-6" x2="4" y2="-6" stroke="#58a6ff" stroke-width="2"/>
      <line x1="0" y1="-14" x2="14" y2="0" stroke="#58a6ff" stroke-width="2"/>
      <line x1="0" y1="-14" x2="14" y2="14" stroke="#58a6ff" stroke-width="2"/>
      <line x1="10" y1="8" x2="14" y2="14" stroke="#0d1117" stroke-width="3"/>
      <path d="M 14 14 l -3 1 l 1 -3 z" fill="#58a6ff"/>
      <text x="-20" y="-26" fill="#7d8590" font-size="7">B</text>
      <text x="-34" y="5" fill="#7d8590" font-size="7">E</text>
      <text x="18" y="0" fill="#7d8590" font-size="7">C</text>
    </g>

    <!-- Base resistor R1 (1kΩ) -->
    <line x1="30" y1="-55" x2="140" y2="-55" stroke="#58a6ff" stroke-width="2" transform="translate(0,125)"/>
    <text x="60" y="168" fill="#e6edf3" font-size="9" transform="translate(0,0)">R1</text>
    <text x="60" y="178" fill="#7d8590" font-size="8">1kΩ ±5%</text>

    <!-- GPIO23 wire to base -->
    <path d="M 30 67 L 30 -20 L 67 -20" fill="none" stroke="#58a6ff" stroke-width="2" transform="translate(0,0)"/>
    <text x="150" y="-15" fill="#58a6ff" font-size="8">GPIO 23</text>

    <!-- Relay coil K1 (SRD-05VDC) -->
    <g transform="translate(210, 60)">
      <rect x="0" y="0" width="16" height="28" rx="2" fill="#0d1117" stroke="#e6edf3" stroke-width="1.5"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#e6edf3" stroke-width="1"/>
      <line x1="0" y1="16" x2="16" y2="16" stroke="#e6edf3" stroke-width="1"/>
      <line x1="0" y1="24" x2="16" y2="24" stroke="#e6edf3" stroke-width="1"/>
      <text x="8" y="-22" fill="#e6edf3" font-size="9" font-weight="700">K1</text>
      <text x="8" y="-10" fill="#7d8590" font-size="7">SRD-05VDC-SL-C</text>
      <text x="8" y="45" fill="#7d8590" font-size="7">coil 5V</text>
    </g>

    <!-- Flyback diode D1 (1N4007) -->
    <g transform="translate(150, 60)">
      <path d="M -6 -6 L 8 0 L -6 6 z" fill="#f0c040" stroke="#f0c040" stroke-width="1"/>
      <line x1="8" y1="0" x2="-6" y2="0" stroke="#f0c040" stroke-width="1"/>
      <text x="1" y="-16" fill="#f0c040" font-size="8" font-weight="700">D1</text>
      <text x="1" y="-6" fill="#7d8590" font-size="7">1N4007</text>
    </g>

    <!-- Coil connections -->
    <line x1="67" y1="60" x2="210" y2="60" stroke="#e6edf3" stroke-width="1.5"/>
    <line x1="258" y1="60" x2="320" y2="60" stroke="#e6edf3" stroke-width="1.5"/>
    <line x1="320" y1="60" x2="320" y2="185" stroke="#f85149" stroke-width="1.5"/>

    <!-- Flyback diode across coil -->
    <line x1="150" y1="60" x2="150" y2="88" stroke="#f0c040" stroke-width="1"/>

    <!-- Emitter to GND -->
    <path d="M 67 70 L 67 147" fill="none" stroke="#7d8590" stroke-width="1.5"/>
    <circle cx="67" cy="147" r="2.5" fill="#7d8590"/>

    <!-- ====== OUTPUT CONTACTS 1 ====== -->
    <rect x="10" y="210" width="300" height="50" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="232" fill="#f0c040" font-size="9" font-weight="700">OUTPUT CONTACTS</text>
    <text x="20" y="248" fill="#e6edf3" font-size="9">COM → Live</text>
    <text x="150" y="248" fill="#3fb950" font-size="9">NO → LOAD</text>
    <text x="245" y="248" fill="#f85149" font-size="9">NC → (unused)</text>

    <!-- Load 1 -->
    <rect x="250" y="290" width="70" height="40" rx="6" fill="#161b22" stroke="#f0c040" stroke-width="1.5"/>
    <text x="285" y="310" text-anchor="middle" fill="#f0c040" font-size="10" font-weight="700">LOAD</text>
    <text x="285" y="323" text-anchor="middle" fill="#7d8590" font-size="8">AC/DC</text>

    <!-- Load wiring -->
    <line x1="250" y1="235" x2="250" y2="310" stroke="#f0c040" stroke-width="2"/>
    <line x1="250" y1="310" x2="250" y2="340" stroke="#f0c040" stroke-width="2"/>
    <text x="262" y="360" fill="#f0c040" font-size="8">to Load / Neutral</text>

    <line x1="110" y1="260" x2="110" y2="390" stroke="#f0c040" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="85" y="410" fill="#f0c040" font-size="8">AC Live In</text>

    <text x="160" y="395" fill="#484f58" font-size="8">switchable 250VAC / 10A</text>
  </g>

  <!-- ====== RELAY DRIVER CHANNEL 2 ====== -->
  <g transform="translate(730, 250)">
    <rect x="0" y="0" width="330" height="340" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="165" y="20" text-anchor="middle" fill="#484f58" font-size="10" font-weight="600" letter-spacing="1">CHANNEL 2</text>

    <!-- Transistor Q2 -->
    <text x="30" y="70" fill="#3fb950" font-size="10" font-weight="700">Q2</text>
    <text x="30" y="82" fill="#7d8590" font-size="8">2N2222A</text>
    <g transform="translate(95, 70)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#3fb950" stroke-width="2"/>
      <line x1="-14" y1="0" x2="-28" y2="0" stroke="#3fb950" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="-22" stroke="#3fb950" stroke-width="2"/>
      <line x1="-4" y1="-6" x2="4" y2="-6" stroke="#3fb950" stroke-width="2"/>
      <line x1="0" y1="-14" x2="14" y2="0" stroke="#3fb950" stroke-width="2"/>
      <line x1="0" y1="-14" x2="14" y2="14" stroke="#3fb950" stroke-width="2"/>
      <line x1="10" y1="8" x2="14" y2="14" stroke="#0d1117" stroke-width="3"/>
      <path d="M 14 14 l -3 1 l 1 -3 z" fill="#3fb950"/>
      <text x="-20" y="-26" fill="#7d8590" font-size="7">B</text>
      <text x="-34" y="5" fill="#7d8590" font-size="7">E</text>
      <text x="18" y="0" fill="#7d8590" font-size="7">C</text>
    </g>

    <!-- Base resistor R2 -->
    <line x1="60" y1="168" x2="140" y2="168" stroke="#3fb950" stroke-width="2"/>
    <text x="60" y="185" fill="#e6edf3" font-size="9">R2</text>
    <text x="60" y="195" fill="#7d8590" font-size="8">1kΩ ±5%</text>

    <!-- GPIO22 wire -->
    <path d="M 30 107 L 30 -20 L 67 -20" fill="none" stroke="#3fb950" stroke-width="2" transform="translate(0,0)"/>
    <text x="150" y="-15" fill="#3fb950" font-size="8" filter="url(#glow)">GPIO 22</text>

    <!-- Relay coil K2 -->
    <g transform="translate(210, 60)">
      <rect x="0" y="0" width="16" height="28" rx="2" fill="#0d1117" stroke="#e6edf3" stroke-width="1.5"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#e6edf3" stroke-width="1"/>
      <line x1="0" y1="16" x2="16" y2="16" stroke="#e6edf3" stroke-width="1"/>
      <line x1="0" y1="24" x2="16" y2="24" stroke="#e6edf3" stroke-width="1"/>
      <text x="8" y="-22" fill="#e6edf3" font-size="9" font-weight="700">K2</text>
      <text x="8" y="-10" fill="#7d8590" font-size="7">SRD-05VDC-SL-C</text>
      <text x="8" y="45" fill="#7d8590" font-size="7">coil 5V</text>
    </g>

    <!-- Flyback diode D2 -->
    <g transform="translate(150, 60)">
      <path d="M -6 -6 L 8 0 L -6 6 z" fill="#f0c040" stroke="#f0c040" stroke-width="1"/>
      <line x1="8" y1="0" x2="-6" y2="0" stroke="#f0c040" stroke-width="1"/>
      <text x="1" y="-16" fill="#f0c040" font-size="8" font-weight="700">D2</text>
      <text x="1" y="-6" fill="#7d8590" font-size="7">1N4007</text>
    </g>

    <!-- Coil connections -->
    <line x1="67" y1="60" x2="210" y2="60" stroke="#e6edf3" stroke-width="1.5"/>
    <line x1="258" y1="60" x2="320" y2="60" stroke="#e6edf3" stroke-width="1.5"/>
    <line x1="320" y1="60" x2="320" y2="185" stroke="#f85149" stroke-width="1.5"/>
    <line x1="175" y1="60" x2="175" y2="88" stroke="#f0c040" stroke-width="1"/>

    <!-- Emitter to GND -->
    <path d="M 67 70 L 67 147" fill="none" stroke="#7d8590" stroke-width="1.5"/>
    <circle cx="67" cy="147" r="2.5" fill="#7d8590"/>

    <!-- Output contacts 2 -->
    <rect x="10" y="210" width="300" height="50" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="232" fill="#f0c040" font-size="9" font-weight="700">OUTPUT CONTACTS</text>
    <text x="20" y="248" fill="#e6edf3" font-size="9">COM → Live</text>
    <text x="150" y="248" fill="#3fb950" font-size="9">NO → LOAD</text>
    <text x="245" y="248" fill="#f85149" font-size="9">NC → (unused)</text>

    <!-- Load 2 -->
    <rect x="250" y="290" width="70" height="40" rx="6" fill="#161b22" stroke="#f0c040" stroke-width="1.5"/>
    <text x="285" y="310" text-anchor="middle" fill="#f0c040" font-size="10" font-weight="700">LOAD</text>
    <text x="285" y="323" text-anchor="middle" fill="#7d8590" font-size="8">AC/DC</text>
    <line x1="250" y1="235" x2="250" y2="310" stroke="#f0c040" stroke-width="2"/>
    <line x1="250" y1="310" x2="250" y2="340" stroke="#f0c040" stroke-width="2"/>
    <text x="262" y="360" fill="#f0c040" font-size="8">to Load / Neutral</text>
    <line x1="110" y1="260" x2="110" y2="390" stroke="#f0c040" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="85" y="410" fill="#f0c040" font-size="8">AC Live In</text>
    <text x="160" y="395" fill="#484f58" font-size="8">switchable 250VAC / 10A</text>
  </g>

  <!-- ====== PROTECTION / SUPPORT ====== -->
  <!-- Bulk capacitor C1 -->
  <g transform="translate(330, 620)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#161b22" stroke="#f0c040" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#f0c040" font-size="11" font-weight="700">C1</text>
    <text x="70" y="38" text-anchor="middle" fill="#7d8590" font-size="9">470µF / 16V</text>
    <text x="70" y="52" text-anchor="middle" fill="#7d8590" font-size="8">Electrolytic bulk</text>
  </g>
  <line x1="435" y1="185" x2="470" y2="620" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Decoupling cap C2 -->
  <g transform="translate(520, 620)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#161b22" stroke="#f0c040" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#f0c040" font-size="11" font-weight="700">C2</text>
    <text x="70" y="38" text-anchor="middle" fill="#7d8590" font-size="9">0.1µF / 50V</text>
    <text x="70" y="52" text-anchor="middle" fill="#7d8590" font-size="8">Ceramic decoupling</text>
  </g>
  <line x1="590" y1="185" x2="590" y2="620" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Fuse F1 -->
  <g transform="translate(700, 90)">
    <rect x="0" y="0" width="140" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">F1</text>
    <text x="70" y="38" text-anchor="middle" fill="#7d8590" font-size="9">1A Fuse</text>
    <text x="70" y="52" text-anchor="middle" fill="#7d8590" font-size="8">on 5V rail</text>
  </g>
  <line x1="125" y1="185" x2="700" y2="120" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Status LED D3 -->
  <g transform="translate(890, 90)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">D3 + R3</text>
    <text x="80" y="38" text-anchor="middle" fill="#7d8590" font-size="9">Power LED green</text>
    <text x="80" y="52" text-anchor="middle" fill="#7d8590" font-size="8">220&#937; between 5V &amp; LED</text>
  </g>

  <!-- ====== BILL OF MATERIALS ====== -->
  <g transform="translate(40, 700)">
    <rect x="0" y="0" width="1020" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="24" fill="#7d8590" font-size="11" font-weight="700" letter-spacing="1">BILL OF MATERIALS</text>

    <text x="20" y="48" fill="#e6edf3" font-size="8.5">U1 — ESP32 DevKit V1</text>
    <text x="220" y="48" fill="#e6edf3" font-size="8.5">K1, K2 — Songle SRD-05VDC-SL-C relay, 5V coil, 10A/250VAC SPDT</text>
    <text x="620" y="48" fill="#e6edf3" font-size="8.5">Q1, Q2 — 2N2222A NPN transistor TO-92</text>

    <text x="20" y="66" fill="#e6edf3" font-size="8.5">D1, D2 — 1N4007 flyback diode 1A/1000V</text>
    <text x="360" y="66" fill="#e6edf3" font-size="8.5">R1, R2 — 1kΩ ±5% 0.25W base resistor</text>
    <text x="620" y="66" fill="#e6edf3" font-size="8.5">R3 — 220Ω LED resistor</text>

    <text x="20" y="84" fill="#e6edf3" font-size="8.5">C1 — 470µF/16V electrolytic bulk capacitor</text>
    <text x="360" y="84" fill="#e6edf3" font-size="8.5">C2 — 0.1µF/50V ceramic decoupling</text>
    <text x="620" y="84" fill="#e6edf3" font-size="8.5">P1 — Hi-Link HLK-PM01, AC-DC 5V/3W</text>

    <text x="20" y="102" fill="#7d8590" font-size="8">F1 — 1A fast fuse · D3 — 5mm green LED · PCB terminal blocks 5.08mm</text>
  </g>
</svg>
